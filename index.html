<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spieltagsplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (kostenlose Cloud-Datenbank, damit alle Teammitglieder denselben Stand sehen) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #f3f4f8;
    --panel: #ffffff;
    --panel-alt: #ecedf4;
    --border: #dcdfea;
    --text: #14161f;
    --text-dim: #6b7080;
    --accent: #c9781f;
    --accent-strong: #a9620f;
    --ok: #1f8a5f;
    --ok-bg: #e3f5ec;
    --no: #c23b3b;
    --no-bg: #fbe7e7;
    --maybe: #b8860a;
    --maybe-bg: #faf1d9;
    --unset-bg: #eef0f6;
    --shadow: 0 1px 2px rgba(20,22,31,0.06), 0 8px 24px rgba(20,22,31,0.06);
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131a;
      --panel: #1b1d27;
      --panel-alt: #21232f;
      --border: #2d303e;
      --text: #eceef5;
      --text-dim: #9498ac;
      --accent: #e0a750;
      --accent-strong: #f0bd6c;
      --ok: #49c58a;
      --ok-bg: #123326;
      --no: #ea6767;
      --no-bg: #3a1c1c;
      --maybe: #e0bb4b;
      --maybe-bg: #362c11;
      --unset-bg: #262838;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131a;
    --panel: #1b1d27;
    --panel-alt: #21232f;
    --border: #2d303e;
    --text: #eceef5;
    --text-dim: #9498ac;
    --accent: #e0a750;
    --accent-strong: #f0bd6c;
    --ok: #49c58a;
    --ok-bg: #123326;
    --no: #ea6767;
    --no-bg: #3a1c1c;
    --maybe: #e0bb4b;
    --maybe-bg: #362c11;
    --unset-bg: #262838;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  html, body {
    height: 100%;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  a { color: inherit; }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 20px 64px;
  }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .mark {
    width: 10px; height: 10px;
    border-radius: 3px;
    background: var(--accent);
    display: inline-block;
    transform: rotate(45deg);
    flex: none;
  }
  .brand h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand .sub {
    color: var(--text-dim);
    font-size: 0.82rem;
  }
  .top-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  select, input[type=text], input[type=date] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 14px;
    font-size: 0.86rem;
    font-weight: 500;
    transition: border-color 0.15s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1204;
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.ghost {
    background: transparent;
  }
  .btn.small { padding: 5px 10px; font-size: 0.78rem; border-radius: 7px; }
  .btn.danger { color: var(--no); }

  .team-logo {
    height: 34px;
    width: 34px;
    object-fit: contain;
    border-radius: 8px;
    flex: none;
  }

  .section-heading {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 26px 0 12px;
  }
  #viewMain > .section-heading:first-child { margin-top: 4px; }
  .heading-with-link {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pl-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  .pl-link img { width: 16px; height: 16px; object-fit: contain; }
  .pl-link:hover { border-color: var(--accent); }

  .heading-link {
    color: inherit;
    text-decoration: none;
  }
  .heading-link:hover { color: var(--accent); text-decoration: underline; }

  .player-toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 22px;
  }
  .toggle-chip {
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
  }
  .toggle-chip.on {
    border-color: var(--accent);
    color: var(--text);
    font-weight: 600;
    background: var(--panel-alt);
  }

  .champions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .compact-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .compact-card-name {
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text);
    text-decoration: none;
    margin-bottom: 2px;
  }
  .compact-card-name:hover { color: var(--accent); }
  .compact-tier-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tier-label.small {
    width: 22px;
    height: 22px;
    font-size: 0.78rem;
    border-radius: 6px;
  }
  .compact-tier-champs {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    min-height: 20px;
  }
  .compact-champ {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .tier-empty.small { font-size: 0.72rem; color: var(--text-dim); }

  .nav-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.86rem;
    text-decoration: none;
    margin-bottom: 0;
  }
  .back-link:hover { color: var(--text); }

  .player-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .player-head h2 { margin: 0; font-size: 1.4rem; }
  .player-head .role-icon { width: 22px; height: 22px; }
  .player-head .tag {
    font-size: 0.72rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
  }

  .player-nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0 24px;
  }
  .player-nav a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    text-decoration: none;
    color: var(--text-dim);
  }
  .player-nav a.current {
    border-color: var(--accent);
    color: var(--text);
    font-weight: 600;
  }
  .player-nav a:hover { border-color: var(--accent); }
  .player-nav img.role-icon { width: 14px; height: 14px; }

  .tierlist {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 16px 0 22px;
  }
  .tier-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    min-height: 62px;
  }
  .tier-row.dragover { border-color: var(--accent); background: var(--panel-alt); }
  .tier-label {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .tier-label.s { background: var(--ok-bg); color: var(--ok); }
  .tier-label.a { background: var(--maybe-bg); color: var(--maybe); }
  .tier-label.b { background: var(--unset-bg); color: var(--text-dim); }
  .tier-champs {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    min-height: 40px;
  }
  .tier-empty { color: var(--text-dim); font-size: 0.78rem; padding: 8px 0; }

  .champ-icon {
    position: relative;
    width: 40px;
    height: 40px;
    flex: none;
    cursor: pointer;
    background: var(--panel-alt);
  }
  .champ-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .champ-icon.selected img { outline: 2px solid var(--accent); outline-offset: 1px; }
  .champ-icon .remove-x {
    position: absolute;
    top: -4px; right: -4px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--no);
    color: #fff;
    font-size: 0.6rem;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  .champ-pool-toggle { margin: 4px 0 10px; }
  .champ-pool {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 22px;
  }
  .champ-pool-search {
    width: 100%;
    margin-bottom: 10px;
  }
  .champ-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
  }
  .champ-loading { color: var(--text-dim); font-size: 0.85rem; }

  .roster-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0 26px;
  }
  .chip-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .opgg-link {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    background: #2b5cf0;
  }
  .opgg-link img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .opgg-link:hover { border-color: var(--accent); }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  a.chip:hover { border-color: var(--accent); color: var(--text); }
  a.chip:hover strong { color: var(--text); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .chip.start .dot { background: var(--accent); }
  .chip strong { color: var(--text); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-head h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .card-title-row { display: flex; align-items: center; gap: 8px; }
  .card-head .meta { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; }
  .status-pill {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-pill.good { background: var(--ok-bg); color: var(--ok); }
  .status-pill.warn { background: var(--maybe-bg); color: var(--maybe); }
  .status-pill.bad { background: var(--no-bg); color: var(--no); }
  .status-pill.neutral { background: var(--unset-bg); color: var(--text-dim); }

  .card.result-win { border-color: var(--ok); }
  .card.result-lose { border-color: var(--no); }

  .result-block {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.84rem;
  }
  .result-block select {
    padding: 5px 8px;
    font-size: 0.82rem;
  }
  .result-label { color: var(--text-dim); }
  .result-line {
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .result-line.win { background: var(--ok-bg); color: var(--ok); }
  .result-line.lose { background: var(--no-bg); color: var(--no); }

  .role-icon {
    width: 15px;
    height: 15px;
    object-fit: contain;
    flex: none;
  }

  .edit-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .edit-row input { flex: 1; min-width: 90px; }

  .players {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .prow {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 9px;
  }
  .prow.me { background: var(--panel-alt); }
  .prow .pname {
    font-size: 0.86rem;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .prow .pname .role {
    font-size: 0.68rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    flex: none;
  }
  .prow .pname span.nm {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .toggles {
    display: flex;
    gap: 3px;
  }
  .tbtn {
    width: 30px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--unset-bg);
    color: var(--text-dim);
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: transform 0.1s ease;
  }
  .tbtn:hover { transform: translateY(-1px); }
  .tbtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .tbtn:disabled:hover { transform: none; }
  .prow.readonly { opacity: 0.85; }
  .tbtn.active.yes { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .tbtn.active.maybe { background: var(--maybe-bg); color: var(--maybe); border-color: var(--maybe); }
  .tbtn.active.no { background: var(--no-bg); color: var(--no); border-color: var(--no); }

  .note-line {
    font-size: 0.74rem;
    color: var(--text-dim);
    padding-left: 8px;
    margin-top: -2px;
  }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  .resched {
    font-size: 0.8rem;
  }
  .resched .req {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--maybe-bg);
    color: var(--maybe);
    border-radius: 8px;
    padding: 6px 9px;
    margin-bottom: 6px;
  }
  .resched .req span { overflow: hidden; text-overflow: ellipsis; }
  .resched .req button {
    background: none; border: none; color: inherit; font-size: 0.9rem; padding: 0 2px;
  }
  .resched-form {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .resched-form input { flex: 1; }

  .manage {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 22px;
  }
  .manage.open { display: block; }
  .manage h3 { margin: 0 0 12px; font-size: 1rem; }
  .manage-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 700px) {
    .manage-cols { grid-template-columns: 1fr; }
  }
  .manage-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .manage-item { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .manage-item input[type=text] { flex: 1; }
  .manage-item select { width: 110px; }
  .manage-item input.opgg-input, .manage-item input.full-row { flex-basis: 100%; font-size: 0.8rem; }

  footer.hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 30px;
  }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .visually-empty {
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 30px 10px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="team-logo" id="teamLogo" src="" alt="UNC Logo" style="display:none">
      <div>
        <h1>UNC — Uncs still got it</h1>
        <div class="sub">Prime League Planer</div>
      </div>
    </div>
    <div class="top-controls">
      <select id="whoami"></select>
      <button class="btn" id="themeBtn" type="button" title="Theme wechseln">◐</button>
      <button class="btn" id="manageBtn" type="button">Verwaltung</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div id="viewMain">
    <h2 class="section-heading"><a href="#champions" class="heading-link">Champion-Übersicht</a></h2>
    <div class="roster-bar" id="rosterBar"></div>

    <div class="manage" id="managePanel">
      <div class="manage-cols">
        <div>
          <h3>Spieler:innen</h3>
          <div class="manage-list" id="playerList"></div>
          <button class="btn small" id="addPlayer" type="button">+ Spieler:in hinzufügen</button>
        </div>
        <div>
          <h3>Spieltage</h3>
          <div class="manage-list" id="matchdayList"></div>
          <button class="btn small" id="addMatchday" type="button">+ Spieltag hinzufügen</button>
        </div>
      </div>
    </div>

    <h2 class="section-heading heading-with-link">

  const STATUS_ICON = { yes: "✓", maybe: "?", no: "✕" };
  const TIERS = ["S","A","B"];
  let state = null;
  let dbRef = null;
  let manageOpen = false;
  let subscribed = false;
  const editingResults = new Set(); // rein lokal, nicht gespeichert

  // ---- Champion-Daten direkt von Riots offiziellem Data Dragon CDN laden ----
  // (kein Hosting nötig, immer aktuell, offiziell für Community-Tools freigegeben)
  let CHAMPIONS = [];
  let DDRAGON_VERSION = null;
  let championsLoading = null;
  let selectedChamp = null; // im Champion-Pool aktuell angeklickter Champion (nur UI-Zustand)
  let champPoolOpen = false;
  let champSearchText = "";
  let championOverviewSelected = null; // Set von Player-IDs, die in der Champion-Übersicht angezeigt werden (nur UI-Zustand)

  function championIconUrl(champId){
    return "https://ddragon.leagueoflegends.com/cdn/" + DDRAGON_VERSION + "/img/champion/" + champId + ".png";
  }
  function loadChampions(){
    if (championsLoading) return championsLoading;
    championsLoading = (async () => {
      const versions = await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json();
      DDRAGON_VERSION = versions[0];
      const data = await (await fetch("https://ddragon.leagueoflegends.com/cdn/" + DDRAGON_VERSION + "/data/en_US/champion.json")).json();
      CHAMPIONS = Object.values(data.data)
        .map(c => ({ id: c.id, name: c.name }))
        .sort((a,b) => a.name.localeCompare(b.name));
      return CHAMPIONS;
    })().catch(e => {
      console.error("Champion-Liste konnte nicht von Data Dragon geladen werden", e);
      championsLoading = null;
      return [];
    });
    return championsLoading;
  }

  // ---- Einfaches Hash-Routing: "#player/<id>" zeigt die Spielerseite ----
  function getRoute(){
    const hash = location.hash || "";
    const m = hash.match(/^#player\/(.+)$/);
    if (m) return { view: "player", id: decodeURIComponent(m[1]) };
    if (hash === "#champions") return { view: "champions" };
    return { view: "main" };
  }

  function uid(prefix){
    return prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
  }

  function defaultState(){
    const players = [];
    for (let i=1;i<=5;i++) players.push({id: uid("p"), name: "Spieler " + i, role: "start", lane: null, tierlist: {}, opgg: ""});
    players.push({id: uid("p"), name: "Sub 1", role: "sub", lane: null, tierlist: {}, opgg: ""});
    const matchdays = [];
    for (let i=1;i<=7;i++) matchdays.push({id: uid("md"), label: "Spieltag " + i, date: "", time: "", opponent: "", reschedule: [], result: null, plLink: ""});
    return { players, matchdays, availability: {} };
  }

  function cloneState(s){ return JSON.parse(JSON.stringify(s)); }

  function getMe(){
    try { return localStorage.getItem("splan_me") || ""; } catch(e){ return ""; }
  }
  function setMe(id){
    try { localStorage.setItem("splan_me", id); } catch(e){}
  }
  function getTheme(){
    try { return localStorage.getItem("splan_theme") || ""; } catch(e){ return ""; }
  }
  function setTheme(t){
    try { localStorage.setItem("splan_theme", t); } catch(e){}
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }

  function fmtDate(iso){
    if (!iso) return "Datum offen";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function playerById(id){
    return (state.players || []).find(p => p.id === id);
  }

  async function persist(newState){
    state = newState;
    render();
    if (!dbRef) return;
    try {
      await dbRef.set(newState);
    } catch(e){
      console.error("Speichern fehlgeschlagen", e);
      alert("Speichern hat nicht geklappt. Prüfe die Internetverbindung bzw. die Firebase-Konfiguration.");
    }
  }

  function setAvailability(matchdayId, playerId, status){
    const s = cloneState(state);
    s.availability[matchdayId] = s.availability[matchdayId] || {};
    const cur = s.availability[matchdayId][playerId] || {};
    let newStatus = cur.status === status ? null : status;
    // note field only makes sense for "unsicher" / "kann nicht" – clear it once confirmed available
    let newNote = (newStatus === "yes") ? "" : (cur.note || "");
    s.availability[matchdayId][playerId] = { status: newStatus, note: newNote };
    persist(s);
  }

  function setNote(matchdayId, playerId, note){
    const s = cloneState(state);
    s.availability[matchdayId] = s.availability[matchdayId] || {};
    const cur = s.availability[matchdayId][playerId] || {};
    s.availability[matchdayId][playerId] = { status: cur.status || null, note: note };
    persist(s);
  }

  function setResult(matchdayId, us, them){
    const s = cloneState(state);
    const md = s.matchdays.find(m => m.id === matchdayId);
    if (!md) return;
    md.result = { us: us, them: them };
    editingResults.delete(matchdayId);
    persist(s);
  }

  function clearResult(matchdayId){
    const s = cloneState(state);
    const md = s.matchdays.find(m => m.id === matchdayId);
    if (!md) return;
    md.result = null;
    editingResults.delete(matchdayId);
    persist(s);
  }

  function setChampionTier(playerId, champId, tier){
    const s = cloneState(state);
    const p = s.players.find(p => p.id === playerId);
    if (!p) return;
    p.tierlist = p.tierlist || {};
    p.tierlist[champId] = tier;
    persist(s);
  }
  function removeChampionTier(playerId, champId){
    const s = cloneState(state);
    const p = s.players.find(p => p.id === playerId);
    if (!p || !p.tierlist) return;
    delete p.tierlist[champId];
    persist(s);
  }

  function addReschedule(matchdayId, reason){
    const me = getMe();
    if (!me){ alert("Bitte oben zuerst auswählen, wer du bist."); return; }
    const s = cloneState(state);
    const md = s.matchdays.find(m => m.id === matchdayId);
    if (!md) return;
    md.reschedule = md.reschedule || [];
    md.reschedule = md.reschedule.filter(r => r.playerId !== me);
    md.reschedule.push({ playerId: me, reason: reason || "" });
    persist(s);
  }

  function removeReschedule(matchdayId, playerId){
    const s = cloneState(state);
    const md = s.matchdays.find(m => m.id === matchdayId);
    if (!md) return;
    md.reschedule = (md.reschedule || []).filter(r => r.playerId !== playerId);
    persist(s);
  }

  function addPlayer(){
    const s = cloneState(state);
    s.players.push({ id: uid("p"), name: "Neue*r Spieler*in", role: "sub" });
    persist(s);
  }
  function updatePlayer(id, field, value){
    const s = cloneState(state);
    const p = s.players.find(p => p.id === id);
    if (!p) return;
    p[field] = value;
    persist(s);
  }
  function removePlayer(id){
    const s = cloneState(state);
    s.players = s.players.filter(p => p.id !== id);
    Object.keys(s.availability || {}).forEach(mdId => {
      if (s.availability[mdId]) delete s.availability[mdId][id];
    });
    (s.matchdays || []).forEach(md => {
      md.reschedule = (md.reschedule || []).filter(r => r.playerId !== id);
    });
    persist(s);
    if (getMe() === id) setMe("");
  }

  function addMatchday(){
    const s = cloneState(state);
    const n = s.matchdays.length + 1;
    s.matchdays.push({ id: uid("md"), label: "Spieltag " + n, date: "", opponent: "", reschedule: [] });
    persist(s);
  }
  function updateMatchday(id, field, value){
    const s = cloneState(state);
    const md = s.matchdays.find(m => m.id === id);
    if (!md) return;
    md[field] = value;
    persist(s);
  }
  function removeMatchday(id){
    const s = cloneState(state);
    s.matchdays = s.matchdays.filter(m => m.id !== id);
    delete s.availability[id];
    persist(s);
  }

    const sel = document.getElementById("whoami");
    const me = getMe();
    sel.innerHTML = "";
    const optNone = document.createElement("option");
    optNone.value = "";
    optNone.textContent = "Wer bist du?";
    sel.appendChild(optNone);
    (state.players || []).forEach(p => {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.name || "—";

    (state.players || []).forEach(p => {

      wrap.className = "chip-wrap";

  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderManage(){
    const playerList = document.getElementById("playerList");
    playerList.innerHTML = "";
    (state.players || []).forEach(p => {
      const row = document.createElement("div");
      row.className = "manage-item";

    playerList.querySelectorAll("select[data-field]").forEach(el => {
      el.addEventListener("change", () => updatePlayer(el.dataset.id, el.dataset.field, el.value));

    playerList.querySelectorAll("[data-remove]").forEach(el => {
      el.addEventListener("click", () => { if(confirm("Spieler:in entfernen?")) removePlayer(el.dataset.remove); });

        <input type="text" value="${escapeHtml(md.label)}" data-id="${md.id}" data-field="label" style="max-width:100px">
        <input type="date" value="${escapeHtml(md.date)}" data-id="${md.id}" data-field="date">
        <input type="time" value="${escapeHtml(md.time || "")}" data-id="${md.id}" data-field="time" style="max-width:100px">
        <input type="text" placeholder="Gegner" value="${escapeHtml(md.opponent)}" data-id="${md.id}" data-field="opponent" style="max-width:110px">

    mdList.querySelectorAll("input[data-field]").forEach(el => {
      el.addEventListener("change", () => updateMatchday(el.dataset.id, el.dataset.field, el.value));
    });
    mdList.querySelectorAll("[data-remove]").forEach(el => {
      el.addEventListener("click", () => { if(confirm("Spieltag entfernen?")) removeMatchday(el.dataset.remove); });
    });

  function buildMatchdayCard(md, me){
    const avail = (state.availability && state.availability[md.id]) || {};
    const starters = (state.players || []).filter(p => p.role === "start");
    const subs = (state.players || []).filter(p => p.role === "sub");
    const yesStarters = starters.filter(p => (avail[p.id] || {}).status === "yes").length;
    const yesSubs = subs.filter(p => (avail[p.id] || {}).status === "yes").length;
    const anyResponse = [...starters, ...subs].some(p => (avail[p.id] || {}).status);
    const target = starters.length || 5;

    let pillClass = "neutral", pillText = "Noch offen";
    if (anyResponse){
      if (yesStarters >= target){
        pillClass = "good"; pillText = target + "/" + target + " bestätigt";
      } else if (yesStarters + yesSubs >= target){
        pillClass = "warn"; pillText = Math.min(yesStarters + yesSubs, target) + "/" + target + " bestätigt (mit Sub)";
      } else {
        pillClass = "bad"; pillText = (yesStarters + yesSubs) + "/" + target + " bestätigt";
      }
    }

    const result = md.result;
    const isWin = result ? result.us > result.them : null;
    const card = document.createElement("div");
    card.className = "card" + (result ? (isWin ? " result-win" : " result-lose") : "");

    const plLinkHtml = md.plLink
      ? '<a href="' + escapeHtml(md.plLink) + '" target="_blank" rel="noopener noreferrer" class="pl-link" title="Match auf Prime League ansehen"><img src="' + ICON_PRIMELEAGUE + '" alt="Prime League"></a>'
      : '';

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `
      <div>
        <h3 class="card-title-row">${md.opponent ? "vs " + escapeHtml(md.opponent) : "Gegner offen"}${plLinkHtml}</h3>
        <div class="meta">${escapeHtml(md.label)} · ${escapeHtml(fmtDate(md.date))}${md.time ? " · " + escapeHtml(md.time) + " Uhr" : ""}</div>
      </div>
      <div class="status-pill ${pillClass}">${pillText}</div>
    `;
    card.appendChild(head);
    card.appendChild(Object.assign(document.createElement("div"), {className:"divider"}));

    const resultBlock = document.createElement("div");
    resultBlock.className = "result-block";
    if (result && !editingResults.has(md.id)){
      resultBlock.innerHTML = `
        <span class="result-line ${isWin ? "win" : "lose"}">${result.us}:${result.them} ${isWin ? "gewonnen" : "verloren"}</span>
        <button class="btn small ghost" data-edit-result="${md.id}" type="button">Bearbeiten</button>
        <button class="btn small ghost danger" data-delete-result="${md.id}" type="button">Löschen</button>
      `;
    } else {
      const preUs = result ? result.us : 0;
      const preThem = result ? result.them : 0;
      const opts = n => [0,1,2].map(v => `<option value="${v}" ${v === n ? "selected" : ""}>${v}</option>`).join("");
      resultBlock.innerHTML = `
        <span class="result-label">Ergebnis (Bo3):</span>
        <select data-res-us="${md.id}">${opts(preUs)}</select>
        <span>:</span>
        <select data-res-them="${md.id}">${opts(preThem)}</select>
        <button class="btn small" data-save-result="${md.id}" type="button">Speichern</button>
      `;
    }
    card.appendChild(resultBlock);
    card.appendChild(Object.assign(document.createElement("div"), {className:"divider"}));

    const playersWrap = document.createElement("div");
    playersWrap.className = "players";
    [...starters, ...subs].forEach(p => {
      const entry = avail[p.id] || {};
      const lane = laneById(p.lane);
      const row = document.createElement("div");
      const isEditable = !!me && p.id === me;
      row.className = "prow" + (p.id === me ? " me" : "") + (isEditable ? "" : " readonly");
      const toggles = STATUS_ORDER.map(st => {
        const active = entry.status === st ? " active " + st : "";
        const disabledAttr = isEditable ? "" : " disabled";
        return `<button class="tbtn${active}" data-md="${md.id}" data-p="${p.id}" data-status="${st}" title="${st === 'yes' ? 'Kann' : st === 'maybe' ? 'Unsicher' : 'Kann nicht'}"${disabledAttr}>${STATUS_ICON[st]}</button>`;
      }).join("");
      const iconHtml = lane ? '<img class="role-icon" src="' + lane.icon + '" alt="' + lane.label + '" title="' + lane.label + '">' : '';
      row.innerHTML = `
        <div class="pname">${iconHtml}<span class="nm">${escapeHtml(p.name)}</span><span class="role">${p.role === "start" ? "main" : "sub"}</span></div>
        <div class="toggles">${toggles}</div>
      `;
      playersWrap.appendChild(row);
      const needsNote = entry.status === "no" || entry.status === "maybe";
      if (p.id === me && needsNote){
        const noteRow = document.createElement("input");
        noteRow.type = "text";
        noteRow.placeholder = "Notiz (optional, z. B. Grund)";
        noteRow.value = entry.note || "";
        noteRow.style.cssText = "width:100%;margin:2px 0 4px;font-size:0.78rem;padding:5px 8px;";
        noteRow.addEventListener("change", () => setNote(md.id, p.id, noteRow.value));
        playersWrap.appendChild(noteRow);
      } else if (p.id !== me && entry.note && needsNote) {
        const noteLine = document.createElement("div");
        noteLine.className = "note-line";
        noteLine.textContent = "„" + entry.note + "“";
        playersWrap.appendChild(noteLine);
      }
    });
    card.appendChild(playersWrap);

    card.appendChild(Object.assign(document.createElement("div"), {className:"divider"}));

    const resched = document.createElement("div");
    resched.className = "resched";
    const reqs = md.reschedule || [];
    let reqHtml = "";
    reqs.forEach(r => {
      const p = playerById(r.playerId);
      reqHtml += `<div class="req"><span>${escapeHtml(p ? p.name : "?")} schlägt neuen Termin vor${r.reason ? ": " + escapeHtml(r.reason) : ""}</span><button data-remove-req="${r.playerId}" data-md="${md.id}" title="Zurückziehen">✕</button></div>`;
    });
    resched.innerHTML = reqHtml + `
      <div class="resched-form">
        <input type="text" placeholder="Termin vorschlagen" data-reason="${md.id}">
        <button class="btn small" data-ask="${md.id}" type="button">Vorschlagen</button>
      </div>
    `;
    card.appendChild(resched);

    return card;
  }

  function renderGrid(){
    const grid = document.getElementById("grid");
    const gridCompleted = document.getElementById("gridCompleted");
    const completedHeading = document.getElementById("completedHeading");
    grid.innerHTML = "";
    gridCompleted.innerHTML = "";
    const me = getMe();

    if (!(state.matchdays || []).length){
      grid.innerHTML = '<div class="visually-empty">Noch keine Spieltage angelegt. Über „Verwaltung" hinzufügen.</div>';
      gridCompleted.style.display = "none";
      completedHeading.style.display = "none";
      return;
    }

    const byDateAsc = (a, b) => {
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1;
      if (b.date) return 1;
      return 0;
    };

    const open = state.matchdays.filter(md => !md.result).sort(byDateAsc);
    const completed = state.matchdays.filter(md => md.result).sort((a, b) => byDateAsc(b, a)); // neueste zuerst

    if (!open.length){
      grid.innerHTML = '<div class="visually-empty">Keine offenen Spieltage mehr.</div>';
    } else {
      open.forEach(md => grid.appendChild(buildMatchdayCard(md, me)));
    }

    if (completed.length){
      completedHeading.style.display = "";
      gridCompleted.style.display = "";
      completed.forEach(md => gridCompleted.appendChild(buildMatchdayCard(md, me)));
    } else {
      completedHeading.style.display = "none";
      gridCompleted.style.display = "none";
    }

    const wrap = document.getElementById("viewMain");
    wrap.querySelectorAll(".tbtn").forEach(btn => {
      btn.addEventListener("click", () => setAvailability(btn.dataset.md, btn.dataset.p, btn.dataset.status));
    });
    wrap.querySelectorAll("[data-ask]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = wrap.querySelector('[data-reason="' + btn.dataset.ask + '"]');
        addReschedule(btn.dataset.ask, input ? input.value : "");
        if (input) input.value = "";
      });
    });
    wrap.querySelectorAll("[data-remove-req]").forEach(btn => {
      btn.addEventListener("click", () => removeReschedule(btn.dataset.md, btn.dataset.removeReq));
    });
    wrap.querySelectorAll("[data-save-result]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.saveResult;
        const usSel = wrap.querySelector('[data-res-us="' + id + '"]');
        const themSel = wrap.querySelector('[data-res-them="' + id + '"]');
        const us = parseInt(usSel.value, 10);
        const them = parseInt(themSel.value, 10);
        const valid = (us === 2 && them < 2) || (them === 2 && us < 2);
        if (!valid){
          alert("Kein gültiges Bo3-Ergebnis. Ein Team muss 2 Siege haben, das andere 0 oder 1 (z. B. 2:1 oder 0:2).");
          return;
        }
        setResult(id, us, them);
      });
    });
    wrap.querySelectorAll("[data-edit-result]").forEach(btn => {
      btn.addEventListener("click", () => {
        editingResults.add(btn.dataset.editResult);
        render();
      });
    });
    wrap.querySelectorAll("[data-delete-result]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (confirm("Ergebnis wirklich löschen?")) clearResult(btn.dataset.deleteResult);
      });
    });
  }

  function renderPlayerView(playerId){
    const container = document.getElementById("viewPlayer");
    const p = playerById(playerId);
    const navLinks = '<div class="nav-links">'
      + '<a href="#champions" class="back-link">← Champion-Übersicht</a>'
      + '<a href="#" class="back-link">← Hauptseite</a>'
      + '</div>';
    if (!p){
      container.innerHTML = navLinks + '<p>Spieler:in nicht gefunden.</p>';
      const links = container.querySelectorAll(".back-link");
      links[0].addEventListener("click", (e) => { e.preventDefault(); location.hash = "champions"; });
      links[1].addEventListener("click", (e) => { e.preventDefault(); location.hash = ""; });
      return;
    }
    const me = getMe();
    const isMine = me === playerId;
    const lane = laneById(p.lane);

    let html = navLinks;

    html += '<div class="player-nav">';
    (state.players || []).forEach(pl => {
      const plLane = laneById(pl.lane);
      const icon = plLane ? '<img class="role-icon" src="' + plLane.icon + '" alt="">' : '';
      html += '<a href="#player/' + encodeURIComponent(pl.id) + '" class="' + (pl.id === playerId ? "current" : "") + '">' + icon + escapeHtml(pl.name) + '</a>';
    });
    html += '</div>';

    html += '<div class="player-head">';
    if (lane) html += '<img class="role-icon" src="' + lane.icon + '" alt="' + lane.label + '">';
    html += '<h2>' + escapeHtml(p.name) + '</h2>';
    html += '<span class="tag">' + (p.role === "start" ? "main" : "sub") + '</span>';
    if (p.opgg){
      html += '<a href="' + escapeHtml(p.opgg) + '" target="_blank" rel="noopener noreferrer" class="opgg-link" title="OP.GG-Profil von ' + escapeHtml(p.name) + '"><img src="' + ICON_OPGG + '" alt="OP.GG"></a>';
    }
    html += '</div>';

    html += '<div class="tierlist" id="tierlistWrap">';
    TIERS.forEach(t => {
      html += '<div class="tier-row" data-tier-row="' + t + '">';
      html += '<div class="tier-label ' + t.toLowerCase() + '">' + t + '</div>';
      html += '<div class="tier-champs" data-tier-drop="' + t + '"><span class="champ-loading">Lädt…</span></div>';
      html += '</div>';
    });
    html += '</div>';

    if (isMine){
      html += '<button class="btn small champ-pool-toggle" id="champPoolToggle" type="button">' + (champPoolOpen ? "Champion-Auswahl schließen" : "+ Champion importieren") + '</button>';
      html += '<div class="champ-pool" id="champPool" style="display:' + (champPoolOpen ? "block" : "none") + '">';
      html += '<input type="text" class="champ-pool-search" id="champSearch" placeholder="Champion suchen …" value="' + escapeHtml(champSearchText) + '">';
      html += '<div class="champ-grid" id="champGrid"><span class="champ-loading">Lade Champions von Data Dragon…</span></div>';
      html += '</div>';
    }

    container.innerHTML = html;

    const navA = container.querySelectorAll(".back-link");
    navA[0].addEventListener("click", (e) => { e.preventDefault(); location.hash = "champions"; });
    navA[1].addEventListener("click", (e) => { e.preventDefault(); location.hash = ""; });

    if (isMine){
      const toggleBtn = document.getElementById("champPoolToggle");
      toggleBtn.addEventListener("click", () => {
        champPoolOpen = !champPoolOpen;
        document.getElementById("champPool").style.display = champPoolOpen ? "block" : "none";
        toggleBtn.textContent = champPoolOpen ? "Champion-Auswahl schließen" : "+ Champion importieren";
      });
      const searchInput = document.getElementById("champSearch");
      searchInput.addEventListener("input", () => {
        champSearchText = searchInput.value;
        renderChampPool(p);
      });
    }

    loadChampions().then(() => {
      renderTierRows(p, isMine);
      if (isMine) renderChampPool(p);
    });
  }

  function renderTierRows(p, isMine){
    TIERS.forEach(t => {
      const dropZone = document.querySelector('[data-tier-drop="' + t + '"]');
      if (!dropZone) return;
      const champIds = Object.keys(p.tierlist || {}).filter(id => p.tierlist[id] === t);
      if (!champIds.length){
        dropZone.innerHTML = '<span class="tier-empty">Noch keine Champions</span>';
      } else {
        dropZone.innerHTML = champIds.map(id => {
          const champ = CHAMPIONS.find(c => c.id === id);
          const name = champ ? champ.name : id;
          const xBtn = isMine ? '<span class="remove-x" data-remove-champ="' + id + '">✕</span>' : '';
          const draggableAttr = isMine ? ' draggable="true" data-tier-champ="' + id + '"' : '';
          return '<span class="champ-icon"' + draggableAttr + ' title="' + escapeHtml(name) + '"><img src="' + championIconUrl(id) + '" alt="' + escapeHtml(name) + '" loading="lazy" draggable="false">' + xBtn + '</span>';
        }).join("");
      }
      if (isMine){
        const row = dropZone.closest(".tier-row");
        row.addEventListener("dragover", (e) => { e.preventDefault(); row.classList.add("dragover"); });
        row.addEventListener("dragleave", () => row.classList.remove("dragover"));
        row.addEventListener("drop", (e) => {
          e.preventDefault();
          row.classList.remove("dragover");
          const champId = e.dataTransfer.getData("text/plain");
          if (champId && CHAMPIONS.some(c => c.id === champId)) setChampionTier(p.id, champId, t);
        });
        row.addEventListener("click", (e) => {
          if (e.target.closest("[data-remove-champ]")) return;
          if (selectedChamp){
            setChampionTier(p.id, selectedChamp, t);
            selectedChamp = null;
          }
        });
        dropZone.querySelectorAll("[data-tier-champ]").forEach(el => {
          el.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", el.dataset.tierChamp);
          });
        });
      }
    });
    if (isMine){
      document.querySelectorAll("[data-remove-champ]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeChampionTier(p.id, btn.dataset.removeChamp);
        });
      });
    }
  }

  function renderChampPool(p){
    const grid = document.getElementById("champGrid");
    if (!grid) return;
    if (!CHAMPIONS.length){
      grid.innerHTML = '<span class="champ-loading">Champions konnten nicht geladen werden – Internetverbindung prüfen.</span>';
      return;
    }
    const search = (champSearchText || "").toLowerCase();
    const assigned = new Set(Object.keys(p.tierlist || {}));
    const list = CHAMPIONS.filter(c => !assigned.has(c.id) && c.name.toLowerCase().includes(search));
    grid.innerHTML = list.length ? list.map(c => {
      const sel = selectedChamp === c.id ? " selected" : "";
      return '<span class="champ-icon' + sel + '" data-pool-champ="' + c.id + '" draggable="true" title="' + escapeHtml(c.name) + '"><img src="' + championIconUrl(c.id) + '" alt="' + escapeHtml(c.name) + '" loading="lazy" draggable="false"></span>';
    }).join("") : '<span class="champ-loading">Keine Treffer</span>';

    grid.querySelectorAll("[data-pool-champ]").forEach(el => {
      el.addEventListener("click", () => {
        selectedChamp = (selectedChamp === el.dataset.poolChamp) ? null : el.dataset.poolChamp;
        renderChampPool(p);
      });
      el.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", el.dataset.poolChamp);
      });
    });
  }

  function renderChampionsOverview(){
    const container = document.getElementById("viewChampions");
    if (!championOverviewSelected){
      championOverviewSelected = new Set((state.players || []).filter(p => p.role === "start").map(p => p.id));
    }

    const me = getMe();
    const targetPlayer = (me && playerById(me)) ? me : ((state.players || [])[0] ? state.players[0].id : null);

    let html = '<div class="nav-links"><a href="#" class="back-link">← Hauptseite</a>';
    if (targetPlayer){
      html += '<a href="#player/' + encodeURIComponent(targetPlayer) + '" class="back-link">Zur Tierlist →</a>';
    }
    html += '</div>';
    html += '<h2 class="section-heading">Champion-Übersicht</h2>';
    html += '<div class="player-toggle-row" id="playerToggleRow">';
    (state.players || []).forEach(p => {
      const on = championOverviewSelected.has(p.id);
      html += '<button type="button" class="toggle-chip' + (on ? " on" : "") + '" data-toggle-player="' + p.id + '">' + escapeHtml(p.name || "—") + '</button>';
    });
    html += '</div>';
    html += '<div class="champions-grid" id="championsGrid"><span class="champ-loading">Lädt…</span></div>';

    container.innerHTML = html;

    container.querySelector(".back-link").addEventListener("click", (e) => {
      e.preventDefault();
      location.hash = "";
    });
    container.querySelectorAll("[data-toggle-player]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.togglePlayer;
        if (championOverviewSelected.has(id)) championOverviewSelected.delete(id);
        else championOverviewSelected.add(id);
        renderChampionsOverview();
      });
    });

    loadChampions().then(() => renderChampionsGrid());
  }

  function renderChampionsGrid(){
    const grid = document.getElementById("championsGrid");
    if (!grid) return;
    const selected = (state.players || []).filter(p => championOverviewSelected.has(p.id));
    if (!selected.length){
      grid.innerHTML = '<div class="visually-empty">Keine Spieler ausgewählt.</div>';
      return;
    }
    grid.innerHTML = selected.map(p => {
      let card = '<div class="compact-card">';
      card += '<a href="#player/' + encodeURIComponent(p.id) + '" class="compact-card-name">' + escapeHtml(p.name || "—") + '</a>';
      TIERS.forEach(t => {
        const ids = Object.keys(p.tierlist || {}).filter(id => p.tierlist[id] === t);
        card += '<div class="compact-tier-row"><span class="tier-label small ' + t.toLowerCase() + '">' + t + '</span><div class="compact-tier-champs">';
        if (!ids.length){
          card += '<span class="tier-empty small">–</span>';
        } else {
          card += ids.map(id => {
            const champ = CHAMPIONS.find(c => c.id === id);
            const name = champ ? champ.name : id;
            return '<img class="compact-champ" src="' + championIconUrl(id) + '" alt="' + escapeHtml(name) + '" title="' + escapeHtml(name) + '" loading="lazy">';
          }).join("");
        }
        card += '</div></div>';
      });
      card += '</div>';
      return card;
    }).join("");
  }

  function render(){
    if (!state) return;
    renderWhoAmI();
    const route = getRoute();
    const mainEl = document.getElementById("viewMain");
    const playerEl = document.getElementById("viewPlayer");
    const championsEl = document.getElementById("viewChampions");
    const manageBtn = document.getElementById("manageBtn");
    mainEl.style.display = "none";
    playerEl.style.display = "none";
    championsEl.style.display = "none";
    manageBtn.style.display = "none";
    if (route.view === "player" && playerById(route.id)){
      playerEl.style.display = "";
      renderPlayerView(route.id);
    } else if (route.view === "champions"){
      championsEl.style.display = "";
      renderChampionsOverview();
    } else {
      mainEl.style.display = "";
      manageBtn.style.display = "";
      renderRosterBar();
      renderManage();
      renderGrid();
    }
  }

  async function init(){
    const savedTheme = getTheme();
    if (savedTheme) setTheme(savedTheme);

    window.addEventListener("hashchange", () => {
      selectedChamp = null;
      champPoolOpen = false;
      champSearchText = "";
      render();
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      setTheme(cur === "dark" ? "light" : cur === "light" ? "" : "dark");
    });
    document.getElementById("manageBtn").addEventListener("click", () => {
      manageOpen = !manageOpen;
      document.getElementById("managePanel").classList.toggle("open", manageOpen);
      document.getElementById("manageBtn").textContent = manageOpen ? "Fertig" : "Verwaltung";
    });
    document.getElementById("whoami").addEventListener("change", (e) => {
      setMe(e.target.value);
      render();
    });
    document.getElementById("addPlayer").addEventListener("click", addPlayer);
    document.getElementById("addMatchday").addEventListener("click", addMatchday);

    // render an initial local default immediately so the page never looks blank
    state = defaultState();
    render();

    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === "DEIN_API_KEY"){
      console.warn("Firebase ist noch nicht konfiguriert – trage FIREBASE_CONFIG oben im <script> ein.");
      const warn = document.createElement("div");
      warn.style.cssText = "background:var(--no-bg);color:var(--no);padding:12px 14px;border-radius:10px;margin:16px 0;font-size:0.88rem;";
      warn.innerHTML = '⚠️ Firebase ist noch nicht konfiguriert. Trage im HTML-Quelltext oben im &lt;script&gt; deine FIREBASE_CONFIG ein, damit Änderungen für alle gespeichert werden. Bis dahin läuft die Seite nur lokal in diesem Browser-Tab.';
      document.getElementById("viewMain").prepend(warn);
      return;
    }

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth();
      const firestore = firebase.firestore();
      dbRef = firestore.collection("team").doc("state");

      auth.onAuthStateChanged((user) => {
        if (!user || subscribed) return;
        subscribed = true;
        let seeded = false;
        dbRef.onSnapshot((snap) => {
          if (snap.exists && snap.data()){
            state = snap.data();
            render();
          } else if (!seeded) {
            seeded = true;
            const seed = defaultState();
            dbRef.set(seed).catch(e => console.error(e));
          }
        }, (err) => {
          console.error("Firestore-Fehler", err);
        });
      });

      auth.signInAnonymously().catch((e) => {
        console.error("Anmeldung fehlgeschlagen", e);
        alert("Anmeldung bei Firebase fehlgeschlagen. Ist \"Anonymous\" unter Authentication → Sign-in method aktiviert?");
      });
    } catch(e){
      console.error("Firebase-Init fehlgeschlagen", e);
    }
  }

  init();
})();
</script>
</body>
</html>
