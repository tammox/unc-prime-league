<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNC Planer</title>
<link rel="icon" type="image/avif" href="https://cdn.7tv.app/emote/01HAQKNAF00004CB92YXKWN01E/4x.avif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (kostenlose Cloud-Datenbank, damit alle Teammitglieder denselben Stand sehen) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="team-logo" id="teamLogo" src="" alt="UNC Logo" style="display:none">
      <div>
        <h1>UNC — Uncs still got it</h1>
        <div class="sub">Prime League Planer</div>
      </div>
    </div>
    <div class="top-controls">
      <select id="whoami"></select>
      <button class="btn" id="manageBtn" type="button">Verwaltung</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div id="viewMain">
    <h2 class="section-heading"><a href="#champions" class="heading-link">Champion-Übersicht</a></h2>
    <div class="roster-bar" id="rosterBar"></div>

    <div class="manage" id="managePanel">
      <div class="manage-cols">
        <div>
          <h3>Spieler:innen</h3>
          <div class="manage-list" id="playerList"></div>
          <button class="btn small" id="addPlayer" type="button">+ Spieler:in hinzufügen</button>
        </div>
        <div>
          <h3>Spieltage</h3>
          <div class="manage-list" id="matchdayList"></div>
          <button class="btn small" id="addMatchday" type="button">+ Spieltag hinzufügen</button>
        </div>
      </div>
    </div>

    <h2 class="section-heading heading-with-link">
      Spieltage
      <a href="https://www.primeleague.gg/de/leagues/prm/3227-fall-split-202627/teams/212823-uncs-still-got-it" target="_blank" rel="noopener noreferrer" class="pl-link" title="Team-Seite auf Prime League öffnen">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAIAAAD9b0jDAAAAjElEQVR4Ae3VrQ2AMBAF4AsGT8KEsEMVLAOmoqISLDjIubpuUNcF4ILpAg9CoE899aW/OTpuSEYfR9dlwaPjMGit8dsnImstGO27LrkodN82uuKcw6PM7L3Hr7RtGmMMGFVKpfMFomVRSP8tKmWeJvDti/j6dyoF9qNijHVVAdHk4lFJCIGZ8+D7FnoC+CGaTHTrjYkAAAAASUVORK5CYII=" alt="Prime League">
      </a>
    </h2>
    <div class="grid" id="grid"></div>

    <h2 class="section-heading" id="completedHeading" style="display:none">Abgeschlossen</h2>
    <div class="grid" id="gridCompleted" style="display:none"></div>
  </div>

  <div id="viewPlayer" style="display:none"></div>

  <div id="viewChampions" style="display:none"></div>

  <div id="viewDraft" style="display:none"></div>

  <div class="modal-overlay" id="pickerOverlay" style="display:none">
    <div class="modal-box picker-box" id="pickerBox"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <footer class="hint">Änderungen werden automatisch für das ganze Team gespeichert.</footer>
</div>

<script src="app.js"></script>
</body>
</html>
